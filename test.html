<!DOCTYPE html>
<html lang="en">
<style>

  a {
    max-width: 580px;
    color: #3CC8B4 !important;
    text-decoration: none;
    cursor: pointer;
    word-wrap: break-word;
  }

</style>

<head>
  <meta charset="UTF-8">
  <title>${emailTitle}</title>
</head>

<body>
<table style="width:100%;background-color: #f4f4f4;">
  <tr>
    <td align="center"
        style="padding-top:100px;padding-bottom:100px;">
      <table bgcolor="#ffffff"
             width="580"
             border="0"
             cellpadding="0"
             cellspacing="0"
             style="margin:20px;border-top:solid 2px #3cc8b4;width: 580px;">
        <tr>
          <td border="10"
              style="padding-top:20px;font-size: 14px;color:#aaaaaa;margin: 0; padding-left: 60px;">
            ${tenantEmailTitle}
          </td>
          <td rowspan="2"
              align="right"
              style="padding-top:20px;padding-right:60px;">
            <img src="${tenantEmailImg}"
                 alt="illus"
                 height="56">
          </td>
        </tr>
        <tr>
          <td style="font-size: 16px;color:#333333;margin: 0; padding-left: 60px;">
            ${systemFullName}<br>
          </td>
        </tr>
        <tr>
          <td style="font-size: 16px;color:#333333;margin: 0; padding-left: 60px;">
            ${systemFullNameAlias}
          </td>
        </tr>
        <tr>
          <td colspan="2">
            &nbsp;
          </td>
        </tr>
        <tr>
          <td colspan="2"
              style="border-top:solid 1px #eaeaea;">
            &nbsp;
          </td>
        </tr>
        <!-- 中文内容 -->
        <tr>
          <td colspan="2" style="padding-left:60px;padding-right: 60px; padding-top: 20px; padding-bottom: 20px;">
            <p>
              <b style="color:#333333;font-size: 20px;">Hi
                ${nickName}，</b><br><br>
              欢迎你加入${systemFullName}<br><br>
              <a href="https://${siteUrl}/user/proregist?${urlToken}">立即加入</a><br><br>
              如果按钮无法点击，请直接访问以下链接：<br><br>
              <a href="https://${siteUrl}/user/proregist?${urlToken}">https://${siteUrl}/user/proregist?${urlToken}</a>
            </p>
          </td>
        </tr>
        <tr>
          <td colspan="2">
            &nbsp;
          </td>
        </tr>
        <tr>
          <td border="10"
              style="font-size: 14px;color:#666666;margin: 0; padding-left: 60px;">
            祝你使用愉快，
          </td>
          <td rowspan="2"
              align="right"
              style="padding-right:60px;">
            <img src="https://static.tezign.com/5369fd0e577bbc8ab3e76471821165b3"
                 alt=""
                 width="45"
                 height="45">
          </td>
        </tr>
        <tr>
          <td style="font-size: 14px;color:#666666;margin: 0; padding-left: 60px;">
            ${emailFromName}
          </td>
        </tr>
        <tr>
          <td colspan="2"
              style="border-bottom:solid 1px #eaeaea;padding-bottom: 30px;">
            &nbsp;
          </td>
        </tr>

        <tr>
          <td colspan="2"
              bgcolor="#f4f4f4"
              valign="middle"
              align="center">
            <p style="padding-left:160px;">
              <img src="https://static.tezign.com/ce41177dc66424a79ac5336ed4c216f1"
                   height="22"
                   width="22"
                   alt=""
                   style="float: left;">
              <span style="font-size: 12px; float: left; color:#aaaaaa;">
                                    &nbsp;Copyright©2025&nbsp;特赞&nbsp;|&nbsp;
                                </span>
              <a target="_blank"
                 href="https://www.tezign.com"
                 style="float: left;color: #3cc8b4;font-size: 12px;">www.tezign.com</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>

</html>
